<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="gradFusion" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5BE47" />
      <stop offset="50%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#A855F7" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#060713" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="100" height="100" rx="24" fill="#0A0B1E" />
  <circle cx="50" cy="50" r="45" fill="url(#glow)" />
  
  <!-- Intersecting ribbon curves -->
  <path d="M22 65 C 28 35, 45 28, 52 50 C 58 70, 75 65, 80 35" stroke="url(#gradFusion)" stroke-width="4.5" stroke-linecap="round" fill="none"/>
  
  <!-- Stylized FUSION monogram -->
  <text x="50" y="59" font-family="'Cinzel', Georgia, serif" font-size="34" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">F</text>
  
  <!-- Tiny spark accent -->
  <circle cx="76" cy="30" r="3" fill="#F5BE47" />
</svg>
